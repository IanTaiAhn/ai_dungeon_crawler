[project]
name = "dungeon-crawler"
version = "0.1.0"
description = "Local, Ollama-powered text adventure with an autonomous player agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.7",
    "chromadb>=0.5",
    "fastapi>=0.140.7",
    "uvicorn[standard]>=0.51.0",
    "mcp>=1.28.1",
]

[project.scripts]
dungeon-crawler = "dungeon_crawler.cli:main"
dungeon-crawler-eval = "dungeon_crawler.eval_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dungeon_crawler"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
